services:
  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bookmark_db
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_USER: ${BOOKMARK_DB_USERNAME:?Set BOOKMARK_DB_USERNAME in .env}
      MYSQL_PASSWORD: ${BOOKMARK_DB_PASSWORD:?Set BOOKMARK_DB_PASSWORD in .env}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", 'MYSQL_PWD="$$MYSQL_PASSWORD" mysql --protocol=TCP -h 127.0.0.1 -u "$$MYSQL_USER" "$$MYSQL_DATABASE" -e "SELECT 1"']
      interval: 5s
      timeout: 5s
      start_period: 60s
      retries: 12

  api:
    build: ./bookmark-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://db:3306/bookmark_db?sslMode=REQUIRED&serverTimezone=UTC
      BOOKMARK_DB_USERNAME: ${BOOKMARK_DB_USERNAME:?Set BOOKMARK_DB_USERNAME in .env}
      BOOKMARK_DB_PASSWORD: ${BOOKMARK_DB_PASSWORD:?Set BOOKMARK_DB_PASSWORD in .env}
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: ${SPRING_FLYWAY_BASELINE_ON_MIGRATE:-false}
      BOOKMARK_JWT_SECRET: ${BOOKMARK_JWT_SECRET:?Set BOOKMARK_JWT_SECRET in .env}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      GOOGLE_WEB_CLIENT_ID: ${GOOGLE_WEB_CLIENT_ID:-}
      AVATAR_UPLOAD_DIR: /app/uploads/avatars
      BOOKMARK_PUBLIC_BASE_URL: ${BOOKMARK_PUBLIC_BASE_URL:-http://localhost:${BOOKMARK_API_PORT:-8080}}
    ports:
      - "127.0.0.1:${BOOKMARK_API_PORT:-8080}:8080"
    volumes:
      - avatars:/app/uploads/avatars

volumes:
  mysql-data:
  avatars:
